spring:
  application:
    name: chatapp-backend

  # ---- Supabase Postgres connection ----
  # SUPABASE_DB_URL example:
  # jdbc:postgresql://db.<project-ref>.supabase.co:5432/postgres?sslmode=require
  datasource:
    url: ${SUPABASE_DB_URL}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000

  jpa:
    hibernate:
      # Flyway owns the schema — Hibernate should never auto-generate DDL
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:8080}
  # In production, TLS is terminated at the platform load balancer (Render/behind HTTPS).
  # If serving TLS directly from Spring Boot, uncomment and provide a keystore:
  # ssl:
  #   enabled: true
  #   key-store: classpath:keystore.p12
  #   key-store-password: ${SSL_KEYSTORE_PASSWORD}
  #   key-store-type: PKCS12

app:
  jwt:
    secret: ${JWT_SECRET}                     # base64-encoded 256+ bit secret
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}      # 15 min
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000} # 14 days
    issuer: chatapp

  security:
    max-failed-login-attempts: 5
    account-lock-otp-expiration-minutes: 15
    password-reset-token-expiration-minutes: 30
    email-verification-token-expiration-hours: 24

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  mail:
    from: ${MAIL_FROM:no-reply@chatapp.example.com}

  storage:
    # If using Supabase Storage via REST, set the project URL + service role key
    # and implement a SupabaseMediaStorageService (see MediaStorageService javadoc).
    # Until then, LocalMediaStorageService writes to local-dir below — fine for
    # dev/demo, NOT durable on hosts with ephemeral disks.
    supabase-url: ${SUPABASE_URL:}
    supabase-service-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    bucket: ${SUPABASE_STORAGE_BUCKET:chat-media}
    local-dir: ${MEDIA_LOCAL_DIR:./uploaded-media}
    max-file-size-mb: 50
    allowed-mime-types: image/png,image/jpeg,image/webp,image/gif,video/mp4,video/quicktime,application/pdf,audio/mpeg,audio/wav,audio/ogg,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document

  public-base-url: ${PUBLIC_BASE_URL:http://localhost:8080}

logging:
  level:
    com.chatapp: INFO
    org.springframework.security: WARN
